{% load static %}

<style>

/* =========================================
   UNITECABS NAVBAR
========================================= */

header.navbar {
    width: 100% !important;
    height: 75px !important;
    background: #0D1424 !important;

    display: flex !important;
    flex-direction: row !important;
    align-items: center !important;
    justify-content: space-between !important;

    padding: 0 5% !important;
    margin: 0 !important;

    box-sizing: border-box !important;

    position: relative !important;
    z-index: 9999 !important;
}


/* =========================================
   LOGO
========================================= */

header.navbar .logo-box {
    display: flex !important;
    flex-direction: row !important;
    align-items: center !important;

    gap: 10px !important;

    margin: 0 !important;
    padding: 0 !important;
}

header.navbar .logo-bg {
    width: 48px !important;
    height: 48px !important;

    background: #ffffff !important;

    border-radius: 8px !important;

    display: flex !important;
    align-items: center !important;
    justify-content: center !important;

    overflow: hidden !important;
}

header.navbar .logo-bg img {
    width: 38px !important;
    height: 38px !important;

    object-fit: contain !important;
}

header.navbar .brand {
    font-size: 24px !important;
    font-weight: 800 !important;

    white-space: nowrap !important;
}

header.navbar .white {
    color: #ffffff !important;
}

header.navbar .orange {
    color: #ff7a00 !important;
}


/* =========================================
   DESKTOP NAVIGATION
========================================= */

header.navbar nav {
    display: block !important;

    position: static !important;
}

header.navbar .nav-menu {
    display: flex !important;
    flex-direction: row !important;
    align-items: center !important;

    gap: 25px !important;

    margin: 0 !important;
    padding: 0 !important;

    list-style: none !important;
}

header.navbar .nav-menu li {
    list-style: none !important;
}


/* =========================================
   NAV LINKS
========================================= */

header.navbar .nav-menu a {
    color: #ffffff !important;

    text-decoration: none !important;

    font-size: 15px !important;
    font-weight: 600 !important;
}

header.navbar .nav-menu a:hover {
    color: #ff7a00 !important;
}


/* =========================================
   BOOK CAB BUTTON
========================================= */

header.navbar .book-cab-btn {
    color: #ffffff !important;
}


/* =========================================
   LOGIN BUTTON
========================================= */

header.navbar .login-btn {
    display: inline-flex !important;

    align-items: center !important;
    justify-content: center !important;

    padding: 9px 18px !important;

    background: #ff7a00 !important;
    color: #ffffff !important;

    border-radius: 7px !important;

    text-decoration: none !important;

    font-size: 14px !important;
    font-weight: 600 !important;

    box-sizing: border-box !important;
}

header.navbar .login-btn:hover {
    background: #e96d00 !important;
    color: #ffffff !important;
}


/* =========================================
   LOGGED-IN USER BOX
========================================= */

header.navbar .user-box {
    display: flex !important;

    align-items: center !important;
    gap: 12px !important;

    margin: 0 !important;
    padding: 0 !important;
}

header.navbar .user-name {
    color: #ffffff !important;

    font-size: 14px !important;
    font-weight: 600 !important;

    white-space: nowrap !important;
}

header.navbar .logout-btn {
    display: inline-flex !important;

    align-items: center !important;
    justify-content: center !important;

    padding: 9px 16px !important;

    background: #ff7a00 !important;
    color: #ffffff !important;

    border-radius: 7px !important;

    text-decoration: none !important;

    font-size: 14px !important;
    font-weight: 600 !important;
}

header.navbar .logout-btn:hover {
    background: #e96d00 !important;
}


/* =========================================
   HAMBURGER
========================================= */

header.navbar .menu-toggle {
    display: none;
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 768px) {

    header.navbar {
        width: 100% !important;
        height: 65px !important;

        padding: 0 15px !important;
    }


    /* LOGO */

    header.navbar .logo-box {
        display: flex !important;

        align-items: center !important;
        justify-content: flex-start !important;
    }

    header.navbar .logo-bg {
        width: 40px !important;
        height: 40px !important;
    }

    header.navbar .logo-bg img {
        width: 32px !important;
        height: 32px !important;
    }

    header.navbar .brand {
        font-size: 20px !important;
    }


    /* HAMBURGER */

    header.navbar .menu-toggle {
        display: flex !important;

        width: 42px !important;
        height: 42px !important;

        margin: 0 !important;
        padding: 5px !important;

        background: transparent !important;

        border: none !important;

        flex-direction: column !important;

        align-items: center !important;
        justify-content: center !important;

        gap: 5px !important;

        cursor: pointer !important;
    }

    header.navbar .menu-toggle span {
        display: block !important;

        width: 25px !important;
        height: 3px !important;

        background: #ffffff !important;

        border-radius: 3px !important;
    }


    /* MOBILE NAV */

    header.navbar nav {
        display: none !important;

        position: absolute !important;

        top: 65px !important;
        left: 0 !important;

        width: 100% !important;

        background: #0D1424 !important;

        padding: 8px 0 15px !important;

        box-sizing: border-box !important;
    }

    header.navbar nav.active {
        display: block !important;
    }


    /* MOBILE MENU */

    header.navbar .nav-menu {
        display: flex !important;

        flex-direction: column !important;

        width: 100% !important;

        gap: 0 !important;
    }

    header.navbar .nav-menu li {
        width: 100% !important;
    }

    header.navbar .nav-menu a {
        display: block !important;

        width: 100% !important;

        padding: 13px 25px !important;

        box-sizing: border-box !important;
    }


    /* =====================================
       MOBILE USER BOX
    ===================================== */

    header.navbar .user-box {
        width: calc(100% - 40px) !important;

        margin: 10px 20px 0 !important;

        padding: 10px 0 !important;

        display: flex !important;

        flex-direction: column !important;

        align-items: stretch !important;

        gap: 8px !important;
    }

    header.navbar .user-name {
        display: block !important;

        width: 100% !important;

        padding: 10px 15px !important;

        background: rgba(255,255,255,0.05) !important;

        border-radius: 7px !important;

        box-sizing: border-box !important;

        text-align: center !important;

        white-space: normal !important;

        word-break: break-word !important;
    }

    header.navbar .logout-btn {
        width: 100% !important;

        text-align: center !important;

        box-sizing: border-box !important;
    }


    /* LOGIN MOBILE */

    header.navbar .login-btn {
        width: calc(100% - 40px) !important;

        margin: 8px 20px 0 !important;

        text-align: center !important;

        box-sizing: border-box !important;
    }

}


/* =========================================
   SMALL PHONE
========================================= */

@media (max-width: 400px) {

    header.navbar {
        padding: 0 12px !important;
    }

    header.navbar .logo-bg {
        width: 37px !important;
        height: 37px !important;
    }

    header.navbar .logo-bg img {
        width: 29px !important;
        height: 29px !important;
    }

    header.navbar .brand {
        font-size: 18px !important;
    }

}

</style>


<!-- =====================================================
     NAVBAR
===================================================== -->

<header class="navbar">


    <!-- =================================================
         LOGO
    ================================================== -->

    <div class="logo-box">

        <div class="logo-bg">

            <img
                src="{% static 'images/unitecabs.png' %}"
                alt="UniteCabs Logo"
            >

        </div>


        <div class="brand">

            <span class="white">
                Unite
            </span>

            <span class="orange">
                Cabs
            </span>

        </div>

    </div>



    <!-- =================================================
         HAMBURGER
    ================================================== -->

    <button
        class="menu-toggle"
        id="menuToggle"
        type="button"
        aria-label="Open menu"
        aria-expanded="false"
    >

        <span></span>
        <span></span>
        <span></span>

    </button>



    <!-- =================================================
         NAVIGATION
    ================================================== -->

    <nav id="mobileNav">

        <ul class="nav-menu">


            <!-- HOME -->

            <li>

                <a href="{% url 'home' %}">
                    Home
                </a>

            </li>



            <!-- SERVICES -->

            <li>

                <a href="{% url 'services' %}">
                    Services
                </a>

            </li>



            <!-- BOOK CAB -->

            <li>

                {% if user.is_authenticated %}

                    <a
                        href="{% url 'home' %}#booking"
                        class="book-cab-btn"
                    >
                        Book Cab
                    </a>

                {% else %}

                    <a
                        href="{% url 'login' %}?next={% url 'home' %}%23booking"
                        class="book-cab-btn"
                    >
                        Book Cab
                    </a>

                {% endif %}

            </li>



            <!-- ABOUT -->

            <li>

                <a href="{% url 'home' %}#about">
                    About
                </a>

            </li>



            <!-- CONTACT -->

            <li>

                <a href="{% url 'home' %}#contact">
                    Contact
                </a>

            </li>



            <!-- =================================================
                 LOGIN / USER ACCOUNT
            ================================================== -->

            {% if user.is_authenticated %}

                <li>

                    <div class="user-box">

                        <span class="user-name">
                            👤 {{ user.email }}
                        </span>

                        <!-- LOGOUT -> LOGIN PAGE -->

                        <a
                            href="{% url 'logout' %}?next={% url 'login' %}"
                            class="logout-btn"
                        >
                            Logout
                        </a>

                    </div>

                </li>

            {% else %}

                <li>

                    <a
                        href="{% url 'login' %}"
                        class="login-btn"
                    >
                        Login
                    </a>

                </li>

            {% endif %}


        </ul>

    </nav>

</header>



<!-- =====================================================
     NAVBAR JAVASCRIPT
===================================================== -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {


        /* =========================================
           HAMBURGER MENU
        ========================================= */

        const menuToggle =
            document.getElementById(
                "menuToggle"
            );


        const mobileNav =
            document.getElementById(
                "mobileNav"
            );


        if (
            menuToggle &&
            mobileNav
        ) {


            menuToggle.addEventListener(
                "click",
                function () {


                    mobileNav.classList.toggle(
                        "active"
                    );


                    const isOpen =
                        mobileNav.classList.contains(
                            "active"
                        );


                    menuToggle.setAttribute(
                        "aria-expanded",
                        isOpen
                    );

                }
            );



            /* =====================================
               MENU LINK CLICK
            ===================================== */

            const links =
                mobileNav.querySelectorAll(
                    "a"
                );


            links.forEach(
                function (link) {

                    link.addEventListener(
                        "click",
                        function () {

                            mobileNav.classList.remove(
                                "active"
                            );

                            menuToggle.setAttribute(
                                "aria-expanded",
                                "false"
                            );

                        }
                    );

                }
            );

        }

    }

);

</script>
